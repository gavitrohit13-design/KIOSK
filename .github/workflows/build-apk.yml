name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore found at ./debug.keystore."
          else
            echo "debug.keystore not found. Generating temporary debug keystore with keytool..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist and could not be created."
            exit 1
          fi
          echo "Confirmed ./debug.keystore is present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK file
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file was not found at $EXPECTED_APK"
            echo "Discovered files in app/build/outputs/apk:"
            find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: File $EXPECTED_APK does not have a .apk extension."
              exit 1
              ;;
          esac
          echo "Verified APK at $EXPECTED_APK exists, is a non-empty regular file, and has .apk extension."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
          ASSET_FILENAME="${SAN_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          
          TMP_DIR=$(mktemp -d /tmp/apk-release-asset-XXXXXX)
          DEST_PATH="${TMP_DIR}/${ASSET_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"
          
          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset at $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying gh CLI..."
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared APK asset not found at $ASSET_PATH"
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_BODY=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Target Commit:** ${{ github.sha }}

          **Note:**
          - This APK is intended for testing and direct installation on Android devices.
          - It is NOT intended for Google Play Store distribution.
          - It is signed with a temporary debug keystore.
          EOF
          )
          
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$RELEASE_BODY" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "Release created successfully. Fetching details..."
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url --jq .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}")
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 📱 Debug APK Available for Download

          Your debug APK has been successfully built and published to GitHub Releases:

          - **Release:** [$RELEASE_TITLE]($RELEASE_URL)
          - **Release Tag:** \`$TAG_NAME\`
          - **APK Asset:** \`$ASSET_NAME\`

          ### How to Install on Android
          1. Open the [Release Link]($RELEASE_URL) on your Android device.
          2. Download the \`$ASSET_NAME\` file.
          3. Tap the downloaded APK to install (enable "Install unknown apps" if prompted).

          > **Backup Artifact:** The standard GitHub Actions build artifact \`app-debug-apk\` is also preserved and available in the run summary.
          EOF
          else
            echo "::warning::GitHub Release creation did not succeed or was skipped."
            echo "The debug APK artifact ('app-debug-apk') remains available from GitHub Actions."
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ GitHub Release Notice

          While publishing directly to GitHub Releases was not completed (or was skipped), the debug APK was built and preserved as an Actions artifact.

          ### Download from Actions Artifact
          1. Navigate to the **Artifacts** section at the bottom of this workflow run page.
          2. Download the **\`app-debug-apk\`** archive.
          3. Extract the ZIP to obtain \`app-debug.apk\`.
          EOF
          fi
          exit 0
