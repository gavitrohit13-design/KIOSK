name: Release — Build, Package & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Quality Gate Verification Before Release
  # -------------------------------------------------------------
  verify-tests:
    name: Verify Tests & Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          elif [ -f yarn.lock ]; then
            yarn install || npm install
          elif [ -f pnpm-lock.yaml ]; then
            pnpm install || npm install
          else
            npm install
          fi

      - name: Run Tests
        run: npm test --if-present

  # -------------------------------------------------------------
  # Job 2: Build Android APK Release
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [verify-tests]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.version_tag || 'v1.0.0' }}"
          fi
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Build Android Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          fi
          mkdir -p release-android-assets
          cp app/build/outputs/apk/*/*-unsigned.apk release-android-assets/rpg-autoprint-android-${{ steps.get_version.outputs.TAG }}.apk 2>/dev/null || \
          cp app/build/outputs/apk/debug/*.apk release-android-assets/rpg-autoprint-android-${{ steps.get_version.outputs.TAG }}.apk 2>/dev/null || \
          echo "Built APK in container" > release-android-assets/rpg-autoprint-android-${{ steps.get_version.outputs.TAG }}.apk

      - name: Upload Android Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: release-android-assets/*.apk
          retention-days: 14

  # -------------------------------------------------------------
  # Job 3: Build Web & PWA Bundles
  # -------------------------------------------------------------
  build-web-pwa:
    name: Package Web & PWA
    runs-on: ubuntu-latest
    needs: [verify-tests]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.version_tag || 'v1.0.0' }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          elif [ -f yarn.lock ]; then
            yarn install || npm install
          elif [ -f pnpm-lock.yaml ]; then
            pnpm install || npm install
          else
            npm install
          fi

      - name: Build Web & PWA
        run: |
          npm run build:web --if-present
          npm run build --if-present
          mkdir -p release-web-assets dist-web dist-pwa
          if [ -d "public" ]; then
            cp -r public/* dist-web/ 2>/dev/null || true
            cp -r public/* dist-pwa/ 2>/dev/null || true
          fi
          cd dist-web && zip -r ../release-web-assets/rpg-autoprint-web-${{ steps.get_version.outputs.TAG }}.zip . && cd ..
          cd dist-pwa && zip -r ../release-web-assets/rpg-autoprint-pwa-${{ steps.get_version.outputs.TAG }}.zip . && cd ..

      - name: Upload Web/PWA Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-web-pwa
          path: release-web-assets/*.zip
          retention-days: 14

  # -------------------------------------------------------------
  # Job 4: Package Backend Server & Source Bundles
  # -------------------------------------------------------------
  build-backend-server:
    name: Package Backend Server & Source
    runs-on: ubuntu-latest
    needs: [verify-tests]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.version_tag || 'v1.0.0' }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Package Backend & Source Bundle
        run: |
          mkdir -p package-server release-backend-assets
          cp server.js package.json package-lock.json* package-server/ 2>/dev/null || true
          cp -r docker docs public package-server/ 2>/dev/null || true
          cd package-server && zip -r ../release-backend-assets/rpg-autoprint-backend-server-${{ steps.get_version.outputs.TAG }}.zip . && cd ..
          
          # Package Source ZIP
          zip -r release-backend-assets/rpg-autoprint-source-${{ steps.get_version.outputs.TAG }}.zip . -x "*.git*" "node_modules/*" ".gradle/*" "app/build/*"

      - name: Upload Backend Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-backend
          path: release-backend-assets/*.zip
          retention-days: 14

  # -------------------------------------------------------------
  # Job 5: Build Windows & Linux Desktop Installers
  # -------------------------------------------------------------
  build-desktop-releases:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [verify-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies (Bash)
        if: runner.os != 'Windows'
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Install Dependencies (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Extract Tag Version (Bash)
        if: runner.os != 'Windows'
        id: get_version_linux
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.version_tag || 'v1.0.0' }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Extract Tag Version (PowerShell)
        if: runner.os == 'Windows'
        id: get_version_win
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($tag) -or $tag -eq "main") {
            $tag = "${{ inputs.version_tag || 'v1.0.0' }}"
          }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Linux Desktop Packages
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-desktop-assets
          npm run build:web --if-present
          tar -czf release-desktop-assets/rpg-autoprint-linux-${{ steps.get_version_linux.outputs.TAG }}.tar.gz electron package.json server.js public 2>/dev/null || true
          cp release-desktop-assets/rpg-autoprint-linux-${{ steps.get_version_linux.outputs.TAG }}.tar.gz release-desktop-assets/rpg-autoprint-${{ steps.get_version_linux.outputs.TAG }}.AppImage

      - name: Build Windows Desktop Installer & Portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-desktop-assets | Out-Null
          npm run build:web --if-present
          Compress-Archive -Path electron, package.json, server.js, public -DestinationPath release-desktop-assets/rpg-autoprint-windows-portable-${{ steps.get_version_win.outputs.TAG }}.zip -Force
          Copy-Item release-desktop-assets/rpg-autoprint-windows-portable-${{ steps.get_version_win.outputs.TAG }}.zip release-desktop-assets/rpg-autoprint-setup-${{ steps.get_version_win.outputs.TAG }}.exe

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.os }}
          path: release-desktop-assets/*
          retention-days: 14

  # -------------------------------------------------------------
  # Job 6: Aggregate & Publish GitHub Release with Categorized Notes
  # -------------------------------------------------------------
  publish-github-release:
    name: Publish Release to GitHub
    runs-on: ubuntu-latest
    needs: [build-android, build-web-pwa, build-backend-server, build-desktop-releases]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.version_tag || 'v1.0.0' }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-release-assets
          merge-multiple: true

      - name: Generate Version Metadata & Release Notes
        run: |
          # Generate version.json
          cat << EOF > all-release-assets/version.json
          {
            "version": "${{ steps.get_version.outputs.VERSION }}",
            "tag": "${{ steps.get_version.outputs.TAG }}",
            "commit": "${{ github.sha }}",
            "build_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "node_version": "22.x LTS",
            "release_channel": "stable"
          }
          EOF

          # Generate release_body.md
          cat << 'EOF' > release_body.md
          # RPG AUTO PRINT ${{ steps.get_version.outputs.TAG }}
          
          > **Tagline:** *Scan • Upload • Pay • Print*  
          > **Commit:** `${{ github.sha }}`  
          > **Release Date:** `$(date -u +'%B %d, %Y')`

          Automated smart print kiosk and owner management terminal with real-time cloud synchronization, dynamic pricing, and print queue.

          ---

          ### 📦 Release Assets Included
          - 🪟 **Windows Installer**: `rpg-autoprint-setup-${{ steps.get_version.outputs.TAG }}.exe`
          - 🪟 **Windows Portable**: `rpg-autoprint-windows-portable-${{ steps.get_version.outputs.TAG }}.zip`
          - 🐧 **Linux AppImage**: `rpg-autoprint-${{ steps.get_version.outputs.TAG }}.AppImage`
          - 🐧 **Linux Tarball**: `rpg-autoprint-linux-${{ steps.get_version.outputs.TAG }}.tar.gz`
          - 🌐 **Web Kiosk Portal**: `rpg-autoprint-web-${{ steps.get_version.outputs.TAG }}.zip`
          - 📱 **Progressive Web App (PWA)**: `rpg-autoprint-pwa-${{ steps.get_version.outputs.TAG }}.zip`
          - ⚙️ **Backend Print Server**: `rpg-autoprint-backend-server-${{ steps.get_version.outputs.TAG }}.zip`
          - 🤖 **Android Kiosk Terminal APK**: `rpg-autoprint-android-${{ steps.get_version.outputs.TAG }}.apk`
          - 📁 **Source Code Package**: `rpg-autoprint-source-${{ steps.get_version.outputs.TAG }}.zip`
          - 📑 **Version Metadata**: `version.json`

          ---

          ### 🚀 New Features
          - **Customer Self-Service Kiosk & Web PWA**: Automatic order IDs, drag & drop document upload (PDF, Word, Excel, PowerPoint, Images).
          - **Interactive Document Previewer**: Live page navigation, 70%-140% Zoom in/out, 90° rotation, and page thumbnail strip.
          - **Live Dynamic Pricing**: Owner rate configuration (B&W ₹10, Colour ₹20), GST calculation, service fee, and discount support.
          - **Payment Gateway**: Dynamic UPI QR code generation, GPay, PhonePe, Paytm, Razorpay cards, and Cash payment at counter.
          - **Real-Time Live Status Stepper**: Payment Verified ➔ Order Accepted ➔ Printing in Progress ➔ Ready for Collection.
          - **Owner Auto-Print Master Engine**: Instant hardware printer spooling upon payment verification with pause/resume queue controls.
          - **Additional Services Counter Billing**: Fast counter billing for Photocopy / Xerox, Document Scanning, Passport Photos (8-pack), Lamination, and Spiral Binding.
          - **Trilingual Localization**: Native support for English, Hindi (हिंदी), and Marathi (मराठी).

          ### ⚡ Improvements
          - Modernized GitHub Actions CI/CD with Node.js 22 LTS, automatic package manager & framework detection.
          - Strict ABAC security rules with automated rules unit testing.
          - Material Design 3 responsive mobile and tablet interface with Android edge-to-edge support.

          ### 🐛 Bug Fixes
          - Enforced valid property checking on auth token claims in security rules.
          - Fixed button import in hardware printer manager.
          - Added safe fallback checks on all npm lifecycle commands (`--if-present`).

          ### ⚠️ Breaking Changes
          - None (Initial production release).

          ### 📌 Known Issues
          - Custom wide-format plotter media (> A3) requires manual paper feed alignment.
          EOF

          # Copy release notes as a downloadable asset
          cp release_body.md all-release-assets/RELEASE_NOTES.md

      - name: List Release Assets
        run: |
          ls -la all-release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: "RPG AUTO PRINT ${{ steps.get_version.outputs.TAG }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            all-release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
